services:
  # ==========================================
  # 1. GATEWAY (Единая точка входа)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: crm_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - todo_app
      - auth_app

  # ==========================================
  # 2. TODO MICROSERVICE
  # ==========================================
  todo_db:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: always
    env_file:
      - ./todo_microservice/.env
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis_todo:
    image: redis:7-alpine
    container_name: redis_todo
    restart: always
    volumes:
      - redis_todo_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  todo_app:
    build: ./todo_microservice
    container_name: todo_service
    restart: always
    depends_on:
      todo_db:
        condition: service_healthy
      redis_todo:
        condition: service_healthy
    env_file:
      - ./todo_microservice/.env
    volumes:
      - ./todo_microservice/app:/app/app
      - ./todo_microservice/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  todo_celery_worker:
    build:
      context: ./todo_microservice
    container_name: todo_celery_worker
    command: sh -c "PYTHONPATH=/app celery -A app.celery_app:celery worker --loglevel=info"
    env_file:
      - ./todo_microservice/.env
    volumes:
      - ./todo_microservice/app:/app/app
    depends_on:
      redis_todo:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: crm_mailpit
    restart: always
    ports:
      - "8025:8025"

  todo_celery_beat:
    build:
      context: ./todo_microservice
    container_name: todo_celery_beat
    command: sh -c "PYTHONPATH=/app celery -A app.celery_app:celery beat --loglevel=info"
    env_file:
      - ./todo_microservice/.env
    volumes:
      - ./todo_microservice/app:/app/app
    depends_on:
      redis_todo:
        condition: service_healthy

  # ==========================================
  # 3. AUTH MICROSERVICE
  # ==========================================
  auth_db:
    image: postgres:16-alpine
    container_name: auth_postgres
    restart: always
    env_file:
      - ./auth_microservice/.env
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis_auth:
    image: redis:7-alpine
    container_name: redis_auth
    restart: always
    volumes:
      - redis_auth_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth_app:
    build: ./auth_microservice
    container_name: auth_service
    restart: always
    depends_on:
      auth_db:
        condition: service_healthy
      redis_auth:
        condition: service_healthy
    env_file:
      - ./auth_microservice/.env
    volumes:
      - ./auth_microservice/app:/app/app
      - ./auth_microservice/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  todo_pgdata:
  auth_pgdata:
  redis_todo_data:
  redis_auth_data:
