services:
  # База данных PostgreSQL в контейнере
  todo_db:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Приложение FastAPI
  todo_app:
    build: ./todo_microservice
    container_name: todo_service
    restart: always
    depends_on:
      todo_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@todo_db:5432/todo_db
    ports:
      - "8001:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  todo_pgdata:
